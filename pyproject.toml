[project]
name = "morrill"
version = "0.1.0"
description = "Database and machine-learning workflow for airborne EM and borehole data from the Morrill block, Nebraska"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Akbar Akbari Esfahani" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyproj>=3.6",
    "scipy>=1.13",
]

[project.scripts]
morrill = "morrill.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morrill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
